name: Wake Cycle

on:
  schedule:
    - cron: "0 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch: {}

# Grant only the permissions this workflow needs: recording wake data and
# optionally opening a reviewable proposal pull request.
permissions:
  contents: write
  pull-requests: write

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install google-genai
      - name: Run wake cycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python wake.py
      - name: Commit new journal entry
        if: always()
        run: |
          git config user.name "wake-bot"
          git config user.email "wake-bot@users.noreply.github.com"
          # Include the active identity and any archived memory_<name>/
          # histories. nullglob makes memory_* expand to nothing (not a
          # literal, unmatched string) when no archive exists yet — a
          # literal 'memory_*' pathspec passed straight to `git add`
          # fails with "did not match any files" the first time this
          # runs, before any identity has ever been archived.
          shopt -s nullglob
          archives=(memory_*)
          git add --all -- memory "${archives[@]}"
          git diff --quiet --cached || git commit -m "Wake cycle: $(date -u +%Y-%m-%d-%H%M%S)"
          git push
