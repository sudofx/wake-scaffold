name: Wake Cycle

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install google-genai
      - name: Run wake cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python wake.py
      - name: Commit new journal entry
        run: |
          git config user.name "wake-bot"
          git config user.email "wake-bot@users.noreply.github.com"
          git add memory/
          git diff --quiet --cached || git commit -m "Wake cycle: $(date -u +%Y-%m-%d)"
          git push
