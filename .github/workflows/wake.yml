name: Wake — research & journal

on:
  push:
    branches: [master]
    paths: ['wake/**', 'scripts/github_wake.py', 'wake.toml', '.github/workflows/wake.yml']
  schedule:
    # - cron: '42 */3 * * *'
    # Changed because even at setting it to *:42 it won't
    # run 24 times a day. Sometimes only 6 auto all day.
    # Most runs are being envoked manually by a human.
    - cron: '42 * * * *'
  workflow_dispatch:
    inputs:
      publish_only:
        description: Refresh the website without calling Gemini
        type: boolean
        default: false

concurrency:
  group: wake-durable-state
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  wake:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report_ready: ${{ steps.report.outputs.ready }}
      artifact_name: ${{ steps.report.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continue independent research
        id: cycle
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Code updates refresh the existing record; scheduled/manual wakes do research.
        run: python scripts/github_wake.py${{ (github.event_name == 'push' || inputs.publish_only == true) && ' --publish-only' || '' }}
      - name: Confirm report is ready
        id: report
        # A handled provider failure still produces a valid public report.
        if: always()
        run: |
          test -f site/index.html
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'artifact_name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}' >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: always() && steps.report.outcome == 'success'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Save the phone journal
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ${{ steps.report.outputs.artifact_name }}
      - name: Record run summary
        if: always()
        run: |
          if test -f site/operation.json; then
            cat site/operation.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Flag a wake requiring attention
        if: always() && steps.cycle.outcome == 'failure'
        run: exit 1

  publish:
    needs: wake
    if: always() && needs.wake.outputs.report_ready == 'true' && !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the latest journal
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.wake.outputs.artifact_name }}
