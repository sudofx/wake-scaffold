name: Verify the record
on:
  push:
    branches-ignore: [wake-state, journal-pages]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m wake --data /tmp/wake-experiment experiment --cycles 100 --output site
      - run: python -m wake audit --events site/events.jsonl --head site/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-journal-python-${{ matrix.python }}
          path: site/
