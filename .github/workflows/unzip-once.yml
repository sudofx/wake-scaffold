
name: Unzip Once
on: workflow_dispatch

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and flatten
        run: |
          unzip wake-scaffold.zip
          rsync -a wake-scaffold/ ./
          rm -rf wake-scaffold wake-scaffold.zip
      - name: Commit extracted files
        run: |
          git config user.name "setup-bot"
          git config user.email "setup-bot@users.noreply.github.com"
          git add -A
          git commit -m "Extract scaffold from zip"
          git push
