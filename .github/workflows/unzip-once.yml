name: Unzip Once
on: workflow_dispatch

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List zip contents (debug)
        run: unzip -l wake-scaffold.zip

      - name: Unzip and flatten
        run: |
          unzip -o wake-scaffold.zip
          rm -rf __MACOSX
          rsync -a --exclude='.github/workflows/' wake-scaffold/ ./
          rm -rf wake-scaffold wake-scaffold.zip

      - name: Commit extracted files
        run: |
          git config user.name "setup-bot"
          git config user.email "setup-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract scaffold from zip"
          git push
