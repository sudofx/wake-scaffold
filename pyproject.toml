[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-scaffold"
version = "2.0.0"
description = "Disposable models. Durable state. Receipts for everything."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wake = "wake.__main__:main"

[tool.setuptools]
packages = ["wake"]
include-package-data = true

[tool.setuptools.package-data]
wake = ["assets/*"]
