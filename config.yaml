# Which backend to wake up with. Change this to swap models without
# touching any memory files or the wake loop itself.
#
# provider: one of gemini | anthropic | openai | ollama
# model: optional override; leave blank to use each provider's default

provider: gemini
model:

# Gemini only — ignored by every other provider. Google's free tier
# tracks each model's daily request quota separately
# (GenerateRequestsPerDayPerProjectPerModel-FreeTier), so if the
# primary model above returns 429/503, trying a different free model
# on the same key draws from an entirely separate daily allowance, at
# $0 cost. Both listed here are current, free-tier, GA models as of
# Sept 2026. Leave empty ([]) to disable and use only the primary
# model.
gemini_fallback_models:
  - gemini-3.5-flash
  - gemini-3.1-flash-lite

# Any IANA timezone name. All timestamps this project writes anywhere
# — journal filenames, journal content, identity.md, commitments.json,
# and what Bob is told the current time is — use this timezone.
# zoneinfo handles daylight saving automatically, so this doesn't need
# manual adjustment twice a year the way the cron schedule does.
timezone: America/Los_Angeles

# Off by default. When true, Bob can open a real GitHub pull request
# proposing a full-file change to rules.md or index.md (in addition to
# the normal journal-text proposal), instead of only writing about it
# in prose. Requires two things set up in the GitHub repo before it'll
# work: the included workflow must pass GitHub's built-in GITHUB_TOKEN to
# the wake step (you don't need to create a secret), and, in this repo's
# Settings > Actions > General > Workflow permissions, "Read and write
# permissions" plus "Allow GitHub Actions to create and approve pull
# requests" both checked. If those aren't set, this fails gracefully
# and falls back to a normal journal-only proposal — it won't crash a
# wake either way.
enable_pull_requests: true

# Local hour (24h, in `timezone` above) after which a wake is treated as a
# likely last-wake-of-the-day and nudged to look back across the whole day
# rather than just this wake. Approximate on purpose — cron timing isn't
# guaranteed — this is a nudge, not a hard cutoff.
daily_review_hour: 21

# How often (in successful wakes) to nudge Bob to check whether index.md
# — the compressed summary read every wake instead of the full journal —
# is stale and worth refreshing. Optional and self-judged each time, not
# a hard trigger; see build_reflection_prompt's consolidation checkpoint.
index_consolidation_interval_wakes: 15

# Keep the public HTML page readable as blog_posts.json grows. The source
# file remains append-only and complete; only the rendered page is capped.
recent_blog_posts: 20

# Used to build correct htmlpreview blog URLs for the active identity and
# every archived one — single source so renaming/forking the repo doesn't
# require hunting down hardcoded URLs.
github:
  owner: sudofx
  repo: wake-scaffold
  branch: master
